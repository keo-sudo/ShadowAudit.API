name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Descargar el codigo
        uses: actions/checkout@v4

      - name: Instalar .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restaurar paquetes
        run: dotnet restore ShadowAudit.API.slnx

      - name: Compilar
        run: dotnet build ShadowAudit.API.slnx --no-restore --configuration Release

      - name: Correr pruebas (unitarias + integracion con PostgreSQL en Docker)
        run: dotnet test ShadowAudit.API.slnx --no-build --configuration Release --logger "console;verbosity=normal"