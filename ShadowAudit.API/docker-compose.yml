services:
  db:
    image: postgres:17-alpine
    container_name: shadowaudit-db
    restart: unless-stopped
    environment:
      - POSTGRES_DB=shadowaudit
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:?Falta POSTGRES_PASSWORD en el archivo .env}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - shadowaudit_pgdata:/var/lib/postgresql/data

volumes:
  shadowaudit_pgdata: