services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: shadowaudit
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d shadowaudit"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    ports:
      # Solo accesible desde tu propia PC
      - "127.0.0.1:8080:8080"
    environment:
      ConnectionStrings__DefaultConnection: Host=db;Port=5432;Database=shadowaudit;Username=postgres;Password=${POSTGRES_PASSWORD}
      JwtSettings__SecretKey: ${JWT_SECRET_KEY}
      VirusTotal__ApiKey: ${VIRUSTOTAL_API_KEY}
      AbuseIPDB__ApiKey: ${ABUSEIPDB_API_KEY}
      Database__MigrateOnStartup: "true"
    volumes:
      - dpkeys:/keys

volumes:
  pgdata:
  dpkeys: